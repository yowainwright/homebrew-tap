name: tap-ci

on:
  pull_request:
  merge_group:

env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up tap Ruby
        run: |
          brew list ruby >/dev/null 2>&1 || brew install ruby
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
      - name: Validate schema and generated docs
        run: scripts/validate-tap
      - name: Validate changed release files
        run: scripts/validate-tap --changed-strict
      - name: Detect changed formulae
        id: formulae
        shell: bash
        run: |
          git diff --name-only --diff-filter=d "origin/${GITHUB_BASE_REF:-main}...HEAD" -- 'Formula/*.rb' \
            | sed -E 's#^Formula/(.*)\.rb$#yowainwright/tap/\1#' \
            | paste -sd, - \
            | sed 's/^/names=/' >> "$GITHUB_OUTPUT"
      - name: Link tap checkout
        if: steps.formulae.outputs.names != ''
        run: brew tap yowainwright/tap "$GITHUB_WORKSPACE"
      - name: Homebrew changed formulae
        if: steps.formulae.outputs.names != ''
        run: brew test-bot --only-formulae --tap=yowainwright/tap --skip-dependents --testing-formulae="${{ steps.formulae.outputs.names }}"
